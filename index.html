<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelBudget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #1F6E8C 0%, #2E9A7E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .redirect-container {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            margin: 0 auto 24px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .message {
            color: rgba(255,255,255,0.9);
            font-size: 1rem;
        }

        .manual-link {
            margin-top: 32px;
        }

        .manual-link a {
            color: white;
            text-decoration: underline;
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .manual-link a:hover {
            opacity: 1;
        }
    </style>
    <meta http-equiv="refresh" content="0; url=туризм главная.html">
</head>
<body>
    <div class="redirect-container">
        <div class="spinner"></div>
        <div class="logo">TravelBudget</div>
        <div class="message">Перенаправление на главную страницу...</div>
        <div class="manual-link">
            <a href="туризм главная.html">Если автоматического перехода не произошло, нажмите сюда</a>
        </div>
    </div>

    <!-- Резервный JavaScript на случай, если meta refresh не сработает -->
    <script>
        (function() {
            // Мгновенное перенаправление через JavaScript
            window.location.replace("туризм главная.html");
        })();
    </script>
<script src="demo-account.js"></script>
</body>
</html>
